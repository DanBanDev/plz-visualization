services:

  postgis:
      image: postgis/postgis:17-3.5

      container_name: postgis

      environment:
         POSTGRES_DB: plzdb
         POSTGRES_USER: admin
         POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

      ports:
         - "127.0.0.1:5432:5432"
              
      volumes:
         - postgres_data:/var/lib/postgresql/data
      
  backend:  
      build:
        context: ./backend/PlzGeo.Api
        
      container_name: backend
                
      ports:
       - "127.0.0.1:5000:8080"

      depends_on:
       - postgis

      environment:
        ASPNETCORE_ENVIRONMENT: Production
        Jwt__Key: ${JWT_KEY}
        ConnectionStrings__Postgis: Host=${DB_HOST};Port=${DB_PORT};Database=${DB_NAME};Username=${DB_USER};Password=${POSTGRES_PASSWORD}
        
        
  frontend:
      build:
        context: ./frontend/PlzGeo.Client

      container_name: plzgis-frontend

      ports:
        - "127.0.0.1:4200:80"

      depends_on:
        - backend     

volumes:
  postgres_data: